<!doctype html>
<!-- Sandboxed without allow-same-origin: diagram script cannot reach the session or the page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diagram</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <script>
      // An opaque-origin frame throws on storage access; an in-memory stand-in is enough for viewer settings.
      ['localStorage', 'sessionStorage'].forEach(function (name) {
        try {
          window[name].length;
        } catch (e) {
          var kept = {};
          Object.defineProperty(window, name, {
            value: {
              getItem: function (k) {
                return k in kept ? kept[k] : null;
              },
              setItem: function (k, v) {
                kept[k] = String(v);
              },
              removeItem: function (k) {
                delete kept[k];
              },
              clear: function () {
                kept = {};
              },
              key: function (i) {
                return Object.keys(kept)[i] || null;
              },
              get length() {
                return Object.keys(kept).length;
              },
            },
          });
        }
      });
    </script>
    <script src="viewer-static.min.js"></script>
    <script>
      var shown = null;

      function tellPages() {
        if (!shown) return;
        parent.postMessage(
          { type: 'drawio-pages', page: shown.currentPage, count: shown.diagrams.length },
          '*'
        );
      }

      window.addEventListener('message', function (ev) {
        var act = ev.data && ev.data.type === 'drawio-do' ? ev.data.act : null;
        if (!act || !shown) return;
        var graph = shown.graph;
        if (act === 'prev') shown.selectPage(shown.currentPage - 1);
        else if (act === 'next') shown.selectPage(shown.currentPage + 1);
        else if (act === 'zoomIn') graph.zoomIn();
        else if (act === 'zoomOut') graph.zoomOut();
        else if (act === 'fit') {
          var start = graph.initialViewState;
          graph.view.scaleAndTranslate(start.scale, start.translate.x, start.translate.y);
        }
      });

      window.addEventListener('message', function (ev) {
        var data = ev.data;
        if (!data || data.type !== 'drawio' || typeof data.xml !== 'string') return;
        var light = data.theme === 'light';
        document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        document.body.style.backgroundColor = light ? '#ffffff' : Editor.darkColor;
        var host = document.getElementById('graph');
        host.innerHTML = '';
        var el = document.createElement('div');
        el.className = 'mxgraph';
        el.setAttribute(
          'data-mxgraph',
          JSON.stringify({
            xml: data.xml,
            highlight: String(data.highlight || ''),
            nav: true,
            resize: true,
            center: true,
            border: 24,
            lightbox: false,
            'dark-mode': light ? 'light' : 'dark',
          })
        );
        host.appendChild(el);
        try {
          GraphViewer.createViewerForElement(el, function (viewer) {
            shown = viewer;
            spreadGrid(viewer.graph);
            viewer.addListener('graphChanged', function () {
              viewer.graph.view.validateBackground();
              tellPages();
            });
            tellPages();
          });
        } catch (err) {
          el.innerText = err.message;
        }
        watchSize();
      });

      function spreadGrid(graph) {
        var view = graph.view;
        var paint = view.validateBackgroundStyles;
        view.validateBackgroundStyles = function () {
          graph.gridEnabled = true;
          paint.apply(this, arguments);
          var svg = view.canvas.ownerSVGElement || view.canvas;
          var box = svg.getBoundingClientRect();
          var at = (svg.style.backgroundPosition || '0px 0px').split(' ').map(parseFloat);
          document.body.style.backgroundImage = svg.style.backgroundImage;
          document.body.style.backgroundPosition =
            box.left + window.scrollX + at[0] + 'px ' + (box.top + window.scrollY + at[1]) + 'px';
          svg.style.backgroundImage = 'none';
          svg.style.backgroundColor = 'transparent';
        };
        graph.gridEnabled = true;
        view.validateBackground();
        window.addEventListener('resize', function () {
          view.validateBackground();
        });
      }

      var watching = null;
      function watchSize() {
        var graph = document.querySelector('.mxgraph');
        if (!graph) return;
        if (watching) watching.disconnect();
        // The absolute toolbar strip spans the window, so only its buttons count toward the size.
        var report = function () {
          var box = graph.getBoundingClientRect();
          var right = box.right;
          var bottom = box.bottom;
          for (var i = 0; i < graph.children.length; i++) {
            var child = graph.children[i];
            var parts = getComputedStyle(child).position === 'absolute' ? child.children : [child];
            for (var j = 0; j < parts.length; j++) {
              var part = parts[j].getBoundingClientRect();
              right = Math.max(right, part.right);
              bottom = Math.max(bottom, part.bottom);
            }
          }
          parent.postMessage(
            {
              type: 'drawio-size',
              width: Math.ceil(right + window.scrollX),
              height: Math.ceil(bottom + window.scrollY),
            },
            '*'
          );
        };
        watching = new ResizeObserver(report);
        watching.observe(graph);
        report();
      }
      parent.postMessage({ type: 'drawio-ready' }, '*');
    </script>
  </body>
</html>
